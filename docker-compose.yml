services:
  responder:
    build:
      context: ./service-b-responder
    container_name: muppet-responder
    environment:
      - RESPONDER_PORT=4001
    ports:
      - "4001:4001"

  gateway:
    build:
      context: ./service-a-gateway
    container_name: muppet-gateway
    environment:
      - GATEWAY_PORT=4000
      # Gateway calls responder via Docker network name
      - RESPONDER_URL=http://responder:4001/respond
    depends_on:
      - responder
    ports:
      - "4000:4000"

  ui:
    build:
      context: ./ui
      args:
        # This value is used in the browser, so localhost:4000 is correct
        - VITE_GATEWAY_URL=http://localhost:4000
    container_name: muppet-ui
    depends_on:
      - gateway
    ports:
      # Serve UI at http://localhost:5173
      - "5173:80"
